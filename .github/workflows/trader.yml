name: Bitget Demo Trader

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "30 13,14 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "Trader mode"
        required: true
        default: "auto_trade"
        type: choice
        options:
          - auto_trade
          - check
          - report
          - state_test

permissions:
  contents: write

concurrency:
  group: bitget-demo-trader
  cancel-in-progress: false

jobs:
  trader:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Demo Trader
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADER_MODE: ${{ github.event_name == 'schedule' && 'auto_trade' || inputs.mode }}

        run: |
          python -u - <<'PY'
          import os
          import time
          import subprocess
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          ny = ZoneInfo("America/New_York")

          def run_trader():
              subprocess.run(
                  ["python", "-u", "trader.py"],
                  check=True
              )

          def test_state():
              from state_store import load_state, save_state

              print("===== STATE STORAGE TEST =====")

              state, sha = load_state()

              print("STATE READ PASSED")
              print("POSITIONS:", len(state["positions"]))
              print("EXECUTION BLOCKED:", state["execution_blocked"])

              state["last_storage_test"] = datetime.now(
                  timezone.utc
              ).isoformat()

              new_sha = save_state(state, sha)

              print("STATE WRITE PASSED")

              confirmed_state, confirmed_sha = load_state()

              if confirmed_sha != new_sha:
                  raise RuntimeError("State SHA mismatch")

              if confirmed_state != state:
                  raise RuntimeError("State content mismatch")

              print("STATE VERIFICATION PASSED")
              print("ALL STATE STORAGE TESTS PASSED")
              print("NO ORDERS WERE PLACED")

          def in_orb_session():
              now = datetime.now(ny)
              minutes = now.hour * 60 + now.minute

              return (
                  now.weekday() < 5
                  and 570 <= minutes < 630
              )

          mode = os.environ.get("TRADER_MODE")

          if mode == "state_test":
              test_state()

          elif mode != "auto_trade":
              run_trader()

          elif in_orb_session():
              print("ORB SESSION ACTIVE")

              while in_orb_session():
                  started = time.time()

                  print(
                      "NEW YORK:",
                      datetime.now(ny).isoformat()
                  )

                  print(
                      "GERMANY:",
                      datetime.now(
                          ZoneInfo("Europe/Berlin")
                      ).isoformat()
                  )

                  run_trader()

                  elapsed = time.time() - started

                  time.sleep(max(1, 60 - elapsed))

              print("ORB SESSION FINISHED")

          else:
              run_trader()
          PY
