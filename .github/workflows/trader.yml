
name: Bitget Demo Trader

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Trader mode"
        required: true
        default: "auto_trade"
        type: choice
        options:
          - auto_trade
          - check
          - report

permissions:
  contents: read

concurrency:
  group: bitget-demo-trader
  cancel-in-progress: false

jobs:
  trader:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Demo Trader
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADER_MODE: ${{ github.event_name == 'schedule' && 'auto_trade' || inputs.mode }}
        run: python trader.py
