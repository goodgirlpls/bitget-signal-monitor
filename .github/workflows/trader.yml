name: Bitget Demo Trader

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Trading mode
        required: true
        default: check
        type: choice
        options:
          - check
          - auto_trade
          - report
          - execution_check
          - execution_test
          - protection_check

permissions:
  contents: read

concurrency:
  group: bitget-demo-trader
  cancel-in-progress: false

jobs:
  trader:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Bitget Demo Trader
        env:
          BITGET_DEMO_API_KEY: ${{ secrets.BITGET_DEMO_API_KEY }}
          BITGET_DEMO_SECRET_KEY: ${{ secrets.BITGET_DEMO_SECRET_KEY }}
          BITGET_DEMO_PASSPHRASE: ${{ secrets.BITGET_DEMO_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRADER_MODE: ${{ inputs.mode }}
        run: |
          if [ "$TRADER_MODE" = "execution_check" ]; then
            python execution_check.py
          elif [ "$TRADER_MODE" = "execution_test" ]; then
            python execution.py
          elif [ "$TRADER_MODE" = "protection_check" ]; then
            python protection.py
          else
            python trader.py
          finame: Bitget Demo Trader

