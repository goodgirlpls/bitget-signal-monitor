name: Bitget Signal Monitor

concurrency:
  group: bitget-signal-monitor
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Monitor or recheck"
        required: false
        default: "monitor"
        type: choice
        options:
          - monitor
          - recheck
      symbol:
        description: "Symbol to recheck"
        required: false
        default: "BTCUSDT"
        type: choice
        options:
          - BTCUSDT
          - ETHUSDT
          - SOLUSDT

  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_MODE: ${{ inputs.mode || 'monitor' }}
          RECHECK_SYMBOL: ${{ inputs.symbol || '' }}
        run: python monitor.py
